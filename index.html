<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة طلبات العملاء</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dfe4ea;--pri:#1f6feb;--ok:#1a9d55;--bad:#d63b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0 0 10px;font-size:18px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{flex:1;min-width:110px;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}.row .x{flex:0 0 auto;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
button.b{padding:9px 14px;border:0;border-radius:7px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.b.ok{background:var(--ok)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;text-align:center}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut)}
.kpi.on{outline:2px solid var(--pri)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.mut{color:var(--mut);font-size:12px}
.hold{color:var(--bad);font-size:13px}
.log{font-size:13px;line-height:1.9;border-top:1px dashed var(--bd);padding-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px}
.mod{background:#8a4fd6;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
#msg{background:#fff3cd;color:#664d03;padding:8px 14px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="msg"></div>
<div id="notify" style="position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:12px;right:12px;z-index:19;display:none;background:#25d366;color:#fff;padding:12px;border-radius:8px;text-align:center"></div>
<div id="toast" style="position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:12px;right:12px;z-index:20;display:none;background:#d63b3b;color:#fff;padding:12px;border-radius:8px;text-align:center"></div>
<header>
  <h1>📦 متابعة طلبات العملاء <span class="mut" style="font-weight:normal">(نسخة Firebase)</span></h1>
  <div style="margin-bottom:8px"><input id="who" list="names" placeholder="اسمك (مطلوب قبل أي حفظ)" style="max-width:320px"><datalist id="names"></datalist><div id="whoBox" style="display:none;flex-wrap:wrap;gap:6px;align-items:center"></div></div>
  <button class="b s" id="ownerBtn" style="margin-bottom:8px" onclick="owner?ownerLogout():ownerLogin()">دخول المدير</button>

    <button data-v="tele">شاشة التيليسيلز</button>
    <button data-v="log">شاشة اللوجيستك</button>

<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ====== عدّل القيم دي بس ====== */
const FIREBASE_CONFIG={apiKey:"AIzaSyAnhSG87VR9Uuev-Ybog1vMArwGPO-xgBE",authDomain:"follow-telesales.firebaseapp.com",projectId:"follow-telesales",appId:"1:93502420574:web:cfad17f249e5876e34e6cf"};
const OWNER_EMAIL="walidelkadi73@gmail.com";
/* ============================== */
const STAGES={new:["جديد – بانتظار اللوجيستك","#6b7686"],checking:["قيد المراجعة بالمخازن","#1f6feb"],modified:["معدّل – يحتاج مراجعة","#8a4fd6"],hold:["متوقف","#d63b3b"],ready:["جاهز للشحن","#d98a00"],partial:["شحن جزئي","#e0701a"],shipped:["تم الشحن","#0c8fa8"],delivered:["تم التسليم","#1a9d55"],cancelled:["ملغي","#444"]};
const SRC=["العميل","اللوجيستك","التيليسيلز (خطأ/تصحيح)"];
let role="",owner=false,pins={};try{role=localStorage.getItem("role")||""}catch(e){}
let db=null,orders=[],view="tele",who="",filter="all",openId=null,modFor=null,selGirl="";
try{who=localStorage.getItem("who")||"";view=localStorage.getItem("v")||"tele";if(role)who=localStorage.getItem("who_"+role)||who}catch(e){}
const $=s=>document.querySelector(s);
const RL={tele:"التيليسيلز",log:"اللوجيستك",wm:"مخزن مشعل",wo:"مخزن أكتوبر",acc:"الحسابات"};
const WHN={wm:"مخزن مشعل",wo:"مخزن أكتوبر"};
const pinOf=n=>String((contacts.find(c=>c.name===n)||{}).pin||"");
const actor=()=>owner?"المدير":who.trim();
const actorRole=()=>owner?"المدير":(RL[role]||"");
let qNum="",qGirl="",wipeAsk=false,delAsk=null;
const match=o=>(!qNum||String(o.num).includes(qNum))&&(!qGirl||String(o.createdBy||"").includes(qGirl));
const searchBar=()=>`<div class="card"><div class="g2"><input id="qn" placeholder="🔍 بحث برقم طلب العميل" value="${esc(qNum)}" oninput="qNum=this.value.trim();render()"><input id="qg" placeholder="🔍 بحث باسم البنت" value="${esc(qGirl)}" oninput="qGirl=this.value.trim();render()"></div><div class="mut" style="margin-top:6px">إجمالي الطلبات المسجّلة في السيستم: <b>${orders.length}</b>${(qNum||qGirl)?" · فيه بحث شغّال، امسح الخانتين لعرض الكل":""}</div></div>`;
async function deleteOrder(id){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("orders").doc(id).delete();delAsk=null;toast("تم الحذف ✔",true)}catch(e){toast("تعذر الحذف: "+(e.message||e.code))}
}
async function wipeAll(){
  if(!db)return toast("الحفظ غير متاح");
  try{await Promise.all(orders.map(o=>db.collection("orders").doc(o.id).delete()));wipeAsk=false;toast("تم مسح كل الطلبات ✔",true)}catch(e){toast("تعذر المسح: "+(e.message||e.code))}
}
const DEFAULT_REASONS=["الصنف غير متوفر بالمخزن","الكمية غير كافية","العميل طلب التأجيل","العميل لا يرد","العنوان غير واضح","بانتظار تحصيل المبلغ"];
let reasons=DEFAULT_REASONS.slice();
const reasonSel=(id,cur,cb)=>`<select class="wi" id="${id}" ${cb?`onchange="${cb}"`:""}><option value="">— اختار السبب —</option>${[...new Set([...(cur&&!reasons.includes(cur)?[cur]:[]),...reasons])].map(r=>`<option ${r===cur?"selected":""}>${esc(r)}</option>`).join("")}</select>`;
async function saveReasons(l){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("settings").doc("reasons").set({list:l});toast("تم حفظ الأسباب ✔",true)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
const addReason=()=>{const v=$("#rn").value.trim();if(!v)return toast("اكتب السبب");if(reasons.includes(v))return toast("السبب ده موجود");saveReasons([...reasons,v])};
const delReason=i=>saveReasons(reasons.filter((_,k)=>k!==i));
const OWNER_WA="201007483001";
const DEFAULTS=[{name:"ياسمين عيسي",phone:"01060390006"},{name:"منار محمد",phone:"01040028295"},{name:"هاجر سعيد",phone:"01022151188"}];
const toArr=v=>Array.isArray(v)?v:Object.values(v||{});
const namesList=()=>[...new Set([...contacts.map(c=>c.name),...orders.map(o=>o.createdBy).filter(Boolean)])];
let contacts=DEFAULTS.slice();
const mergeC=l=>l;
const waNum=n=>{n=String(n).replace(/\D/g,"");if(n.startsWith("0"))n="2"+n;else if(n.startsWith("1"))n="20"+n;return n};
function notice(o,text){
  const msg="🔔 تعديل على طلب #"+o.num+"\nالعميل: "+o.customer+"\nالحالة الحالية: "+STAGES[o.stage][0]+"\nموضوع التعديل: "+text+"\n\nالمعدِّل: "+actor()+(owner?"":" ("+actorRole()+")");
  const link=(num,label)=>'<a target="_blank" rel="noopener noreferrer" style="color:#fff;font-weight:bold;text-decoration:none;display:block;padding:4px" href="https://wa.me/'+waNum(num)+'?text='+encodeURIComponent(msg)+'" onclick="setTimeout(()=>$(\'#notify\').style.display=\'none\',300)">📲 '+label+'</a>';
  const actorTele=!owner&&role==="tele";
  const c=contacts.find(x=>x.name===o.createdBy);
  let h="";
  if(!actorTele&&c)h+=link(c.phone,"ابعت إشعار لـ "+esc(c.name)+" (صاحبة الطلب)");
  if(!owner||actorTele)h+=link(OWNER_WA,"ابعت إشعار للمدير");
  if(!h)return;
  const n=$("#notify");
  n.innerHTML=h+'<span style="cursor:pointer;font-size:13px" onclick="$(\'#notify\').style.display=\'none\'">إغلاق ✕</span>';
  n.style.display="block";
}

function toast(t,ok){const e=$("#toast");e.textContent=t;e.style.background=ok?"#1a9d55":"#d63b3b";e.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>e.style.display="none",4000)}
window.alert=t=>toast(t);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const tag=k=>`<span class="tag" style="background:${STAGES[k][1]}">${STAGES[k][0]}</span>`;
const payTag=o=>o.acct==="full"?`<span class="tag" style="background:#1a9d55">تحصيل كامل مؤكد</span>`:o.acct==="partial"?`<span class="tag" style="background:#d98a00">تحصيل جزئي مؤكد: ${o.accAmt} من ${o.amount||0}</span>`:o.collected?`<span class="tag" style="background:#0c8fa8">البنت بلّغت تحصيل ${o.collected} – بانتظار الحسابات</span>`:`<span class="tag" style="background:#6b7686">لم يتم التحصيل</span>`;
const whTxt=o=>{const it=o.items||[];if(!it.length)return "لم تُسجَّل أصناف بعد";const un=it.filter(i=>!i.wh).length;if(un)return "بانتظار توزيع "+un+" صنف على المخازن";return Object.keys(WHN).filter(w=>it.some(i=>i.wh===w)).map(w=>{const mine=it.filter(i=>i.wh===w),rd=mine.filter(i=>+i.qty>0&&+i.picked>=+i.qty).length,sh=(o.ship||{})[w];return WHN[w]+": "+rd+"/"+mine.length+" جاهز"+(sh&&sh.done?" · تم الشحن":"")}).join(" | ")};
const shipTxt=o=>Object.entries(o.ship||{}).filter(([,v])=>v&&v.done).map(([w,v])=>`<div class="mut">شحن ${WHN[w]||w}${v.ref?": "+esc(v.ref):""}</div>`).join("");
const tlabel=k=>k==="log"?"اللوجيستك (مروان)":k==="wm"?"مخزن مشعل":k==="wo"?"مخزن أكتوبر":k==="wh"?"المخزن":k==="acc"?"الحسابات (شيماء)":k.replace("tele:","");
const pendKeys=o=>[...new Set((o.mentions||[]).flatMap(m=>m.to.filter(k=>!(m.ack||{})[k])))];
const myKey=()=>role==="tele"?"tele:"+who.trim():role;
function targets(r,o,text){
  const c="tele:"+o.createdBy;let t=[];
  if(r==="tele")t=["log"];else if(r==="log")t=[...new Set((o.items||[]).map(i=>i.wh).filter(Boolean)),c];else if(r==="wm"||r==="wo")t=[c,"log"];else if(r==="acc")t=[c];
  if(r==="tele"&&/^التحصيل/.test(text))t.push("acc");
  return t;
}
function inbox(){
  const k=myKey(),it=[];
  orders.forEach(o=>(o.mentions||[]).forEach(m=>{if(m.to.includes(k)&&!(m.ack||{})[k])it.push([o,m])}));
  if(!it.length)return "";
  return `<div class="card" style="border:2px solid #8a4fd6"><b>🔔 إشارات ليك (${it.length}) – لازم تأكد الاطلاع</b>${it.map(([o,m])=>`<div class="row" style="margin-top:8px"><div>#${esc(o.num)} ${esc(o.customer)} – <b>${esc(m.by)}</b>: ${esc(m.text)} <span class="mut">${fmt(m.t)}</span></div><button class="b ok x" onclick="ack('${o.id}','${m.id}')">تم الاطلاع</button></div>`).join("")}</div>`;
}
async function ack(oid,mid){
  const k=myKey(),o=JSON.parse(JSON.stringify(orders.find(x=>x.id===oid))),m=o.mentions.find(x=>x.id===mid);
  m.ack={...(m.ack||{}),[k]:Date.now()};
  try{await db.collection("orders").doc(oid).set(o)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
const mods=o=>(o.log||[]).filter(l=>l.kind==="mod");

/* ---- الأصناف والكميات (لصق من الإكسيل) ---- */
let editItems=null;
const ar2en=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".");
const isNum=s=>s!==""&&!isNaN(+String(s).replace(",","."));
function parseItems(txt){
  const items=[],bad=[],lines=ar2en(txt).split(/\r?\n/).filter(l=>l.trim());
  const cellsOf=l=>l.indexOf("\t")>=0?l.split("\t").map(s=>s.trim()):l.split(/[,;،]/).map(s=>s.trim());
  let map={n:0,c:1,q:2},start=0;
  if(lines.length){
    const h=cellsOf(lines[0]),m={};
    h.forEach((x,i)=>{if(/كود|code|sku|باركود/i.test(x))m.c=i;else if(/كمي|qty|quantity|عدد/i.test(x))m.q=i;else if(/صنف|اسم|item|name|بيان|منتج/i.test(x))m.n=i});
    if(Object.keys(m).length&&!h.some(x=>isNum(x))){
      start=1;
      if(m.n!==undefined&&m.q!==undefined)map={n:m.n,c:m.c,q:m.q};
      else bad.push(lines[0]);
    }
  }
  lines.slice(start).forEach(line=>{
    const c=cellsOf(line);
    const n=c[map.n]||"",q=c[map.q]||"",code=map.c!==undefined?(c[map.c]||""):"";
    const needCols=Math.max(map.n,map.q,map.c===undefined?0:map.c)+1;
    if(c.length>=needCols&&n&&isNum(q))items.push({name:n,code:code,qty:+q.replace(",",".")});
    else bad.push(line);
  });
  return {items,bad};
}
const itemsTsv=o=>(o.items||[]).map(i=>i.name+"\t"+(i.code||"")+"\t"+i.qty).join("\n");
let pendWh={},pendPick={},pendReason={};
const ROWBG={ok:"rgba(26,157,85,.22)",part:"rgba(217,138,0,.22)",bad:"rgba(214,59,59,.18)",un:"transparent",no:"transparent"};
function itemSt(i){
  const q=+i.qty||0,p=+i.picked||0;
  if(!i.wh)return {c:"un",t:"لم يُحدَّد المخزن"};
  if(q>0&&p>=q)return {c:"ok",t:"جاهز ✓"};
  if(p>0)return {c:i.reason?"bad":"part",t:"تحضير جزئي "+p+"/"+q+(i.reason?" – "+i.reason:"")};
  return i.reason?{c:"bad",t:"نقص: "+i.reason}:{c:"no",t:"لم يبدأ التحضير"};
}
/* يحسب حالة الطلب من حالة الأصناف والشحن */
function recalc(o){
  if(["delivered","cancelled"].includes(o.stage))return;
  const it=o.items||[];if(!it.length||it.some(i=>!i.wh))return;
  if(o.stage==="hold"&&o.holdReason&&!/^مخزن/.test(o.holdReason))return; /* توقف يدوي من اللوجيستك */
  const ready=it.every(i=>+i.qty>0&&+i.picked>=+i.qty),inv=[...new Set(it.map(i=>i.wh))],sh=o.ship||{};
  const all=inv.every(w=>sh[w]&&sh[w].done),any=inv.some(w=>sh[w]&&sh[w].done);
  const short=it.find(i=>(+i.picked||0)<(+i.qty)&&i.reason);
  if(all&&ready){o.stage="shipped";o.holdReason=""}
  else if(any){o.stage="partial";o.holdReason=""}
  else if(ready){o.stage="ready";o.holdReason=""}
  else if(short){o.stage="hold";o.holdReason=WHN[short.wh]+": "+short.name+" – "+short.reason}
  else{o.stage="checking";o.holdReason=""}
}
function itemsTbl(o,mode){
  const it=o.items||[];
  if(!it.length)return `<div class="mut" style="margin-top:6px">مفيش أصناف مسجّلة للطلب ده</div>`;
  const rd=it.filter(i=>itemSt(i).c==="ok").length;
  return `<div class="tw" style="margin-top:6px"><div class="mut">جاهز ${rd} من ${it.length} صنف</div><table><tr><th>الصنف</th><th>الكود</th><th>المطلوب</th><th>المخزن</th><th>المتحضّر</th><th>الحالة</th></tr>${it.map((i,x)=>{const s=itemSt(i),k=o.id+"-"+x;return `<tr style="background:${ROWBG[s.c]}"><td>${esc(i.name)}</td><td>${esc(i.code||"")}</td><td><b>${esc(i.qty)}</b></td>
  <td>${mode==="log"?`<select style="min-width:120px" onchange="pendWh['${k}']=this.value"><option value="">— حدّد —</option>${Object.entries(WHN).map(([v,n])=>`<option value="${v}" ${(pendWh[k]!==undefined?pendWh[k]:i.wh)===v?"selected":""}>${n}</option>`).join("")}</select>`:esc(WHN[i.wh]||"—")}</td>
  <td><b>${esc(+i.picked||0)}</b></td><td>${esc(s.t)}</td></tr>`}).join("")}</table></div>`;
}
function itemsBox(o){
  if(editItems!==o.id){
    const it=o.items||[];
    return `<div><b>الأصناف والكميات</b> <span class="mut">(${it.length} صنف)</span>${itemsTbl(o,"log")}
    ${it.length?`<div class="row" style="margin-top:6px"><span class="x mut">اختيار سريع للمخزن:</span><button class="b s x" onclick="allWh('${o.id}','wm')">كل الأصناف ← مشعل</button><button class="b s x" onclick="allWh('${o.id}','wo')">كل الأصناف ← أكتوبر</button><button class="b ok x" onclick="saveWh('${o.id}')">حفظ توزيع المخازن</button></div>`:""}
    <button class="b s" style="margin-top:6px" onclick="editItems='${o.id}';render()">${it.length?"تعديل / لصق من جديد":"📋 لصق الأصناف من الإكسيل"}</button></div>`;
  }
  return `<div><b>الأصناف والكميات</b><div class="mut">انسخ من الإكسيل 3 أعمدة بالترتيب: الصنف ثم الكود ثم الكمية، والصقهم هنا. الأصناف اللي ليها نفس الكود بتحتفظ بمخزنها وتحضيرها.</div>

function saveWh(oid){

  const ch=[];(cur.items||[]).forEach((i,x)=>{const v=pendWh[oid+"-"+x];if(v!==undefined&&v!==(i.wh||""))ch.push(x)});

async function saveItems(id){
  const r=parseItems($("#it-"+id)?.value||"");
  if(r.bad.length)return toast("السطر ده مش مفهوم (لازم صنف وكود وكمية): "+r.bad[0]);
  if(!r.items.length)return toast("الصق الأصناف والكميات الأول");
  const cur=orders.find(x=>x.id===id),prev=(cur&&cur.items)||[],had=prev.length>0;
  const keyOf=i=>i.code?"c:"+i.code:"n:"+i.name,pm={};prev.forEach(p=>pm[keyOf(p)]=p);
  const next=r.items.map(i=>{const p=pm[keyOf(i)];return {name:i.name,code:i.code||"",qty:i.qty,wh:p?p.wh||"":"",picked:p?Math.min(+p.picked||0,+i.qty):0,reason:p?p.reason||"":""}});
  const sig=l=>JSON.stringify(l.map(i=>[i.name,i.code||"",+i.qty]));
  if(had&&sig(prev)===sig(next)){editItems=null;render();return toast("مفيش تغيير في الأصناف")}
  editItems=null;
  const reset=new Set();
  next.forEach(i=>{const p=pm[keyOf(i)];if((!p||+p.qty!==+i.qty)&&i.wh)reset.add(i.wh)});
  prev.forEach(p=>{if(p.wh&&!next.some(n=>keyOf(n)===keyOf(p)))reset.add(p.wh)});
  const fn=o=>{o.items=next;o.ship=o.ship||{};reset.forEach(w=>{if(o.ship[w])o.ship[w].done=false});recalc(o);if(had&&!["delivered","cancelled"].includes(o.stage))o.stage="modified"};
  if(had)await upd(id,fn,"تعديل (اللوجيستك): تحديث الأصناف والكميات ("+next.length+" صنف)","mod",{src:SRC[1]});
  else await upd(id,fn,"تحديث الأصناف والكميات ("+next.length+" صنف)");
}

function savePick(oid,wid){
  const cur=orders.find(x=>x.id===oid);if(!cur||!needName())return;

    if(pendPick[k]!==undefined){const v=ar2en(pendPick[k]).replace(",",".");if(v===""||isNaN(+v)||+v<0)return toast("اكتب رقم صحيح في الكمية المتحضّرة: "+i.name);p=+v}

    if(p>+i.qty)return toast("الكمية المتحضّرة أكبر من المطلوبة في: "+i.name);

  if(!ch.length){render();return toast("مفيش تغيير للحفظ")}

  <div class="card mut">إجمالي التعديلات: <b style="color:var(--tx)">${tm}</b> · من العميل: <b style="color:var(--tx)">${cnt(SRC[0])}</b> · من اللوجيستك: <b style="color:var(--tx)">${cnt(SRC[1])}</b> · أخطاء تيليسيلز: <b style="color:var(--tx)">${cnt(SRC[2])}</b> · غير محصّل: <b style="color:var(--tx)">${unpaid.reduce((s,o)=>s+(o.amount||0)-(o.accAmt||0),0).toLocaleString("ar-EG")}</b></div>
  <div class="card mut">الطلبات الشغالة عند: مخزن مشعل <b style="color:var(--tx)">${wc("wm")}</b> · مخزن أكتوبر <b style="color:var(--tx)">${wc("wo")}</b> · فيها أصناف لسه مش متوزّعة على مخزن <b style="color:var(--tx)">${wc("")}</b></div>
  <div class="card mut">إشارات لم يُؤكَّد الاطلاع عليها: <b style="color:var(--tx)">${orders.reduce((n,o)=>n+pendKeys(o).length,0)}</b>${orders.filter(o=>pendKeys(o).length).map(o=>`<div>#${esc(o.num)}: بانتظار ${pendKeys(o).map(tlabel).join("، ")}</div>`).join("")}</div>
  <div class="card"><b>إدارة الطلبات (للمدير فقط)</b><div class="row" style="margin-top:8px">${wipeAsk?`<span class="hold">متأكد؟ هيتمسح ${orders.length} طلب نهائياً ومينفعش يرجعوا.</span><button class="b x" style="background:var(--bad)" onclick="wipeAll()">نعم، امسح الكل</button><button class="b s x" onclick="wipeAsk=false;render()">إلغاء</button>`:`<button class="b x" style="background:var(--bad)" onclick="wipeAsk=true;render()">🗑 مسح كل الطلبات (${orders.length})</button>`}</div></div>
  <div class="card"><b>أسباب عدم الشحن / التوقف (أنت اللي بتحددها)</b><div class="mut">المخزن واللوجيستك مجبرين يختاروا من القايمة دي بس، مفيش كتابة حرة.</div>
  ${reasons.map((r,i)=>`<div class="row" style="margin-top:6px"><span>${esc(r)}</span><button class="b s x" onclick="delReason(${i})">حذف</button></div>`).join("")||'<div class="mut" style="margin-top:6px">مفيش أسباب – ضيف سبب واحد على الأقل</div>'}
  <div class="row" style="margin-top:8px"><input id="rn" placeholder="سبب جديد، مثلاً: العميل رفض الاستلام"><button class="b x" onclick="addReason()">إضافة</button></div></div>
  <div class="card"><b>البنات: الأرقام والرقم السري لكل واحدة</b><div class="mut">كل بنت بتدخل باسمها ورقمها السري بس، ومش بتقدر تشوف أو تعدّل طلبات غيرها. رقم الموبايل للإشعار الراجع لها.</div>
  ${contacts.map((c,i)=>`<div class="row" style="margin-top:8px"><span><b>${esc(c.name)}</b> – ${esc(c.phone)}${c.pin?"":' <span class="hold">(بدون رقم سري)</span>'}</span><input class="wi" id="gp-${i}" value="${esc(c.pin)}" placeholder="الرقم السري" style="max-width:150px"><button class="b x" onclick="setGirlPin(${i})">حفظ الرقم السري</button><button class="b s x" onclick="delContact(${i})">حذف</button></div>`).join("")}
  <div class="row" style="margin-top:10px"><input id="cn" placeholder="الاسم"><input id="cp" placeholder="رقم الموبايل"><input id="cpin" placeholder="الرقم السري"><button class="b x" onclick="addContact()">إضافة بنت</button></div></div>
  <div class="card"><b>الأرقام السرية للشاشات</b><div class="row" style="margin-top:6px"><input id="pinin" value="${esc(pins.log)}" placeholder="رقم اللوجيستك (فاضي = بدون)"><input id="pinwm" value="${esc(pins.wm)}" placeholder="رقم مخزن مشعل (فاضي = بدون)"><input id="pinwo" value="${esc(pins.wo)}" placeholder="رقم مخزن أكتوبر (فاضي = بدون)"><input id="pinacc" value="${esc(pins.acc)}" placeholder="رقم الحسابات (فاضي = بدون)"><button class="b x" onclick="savePin()">حفظ</button></div></div>
  <div class="card">${list(rows,"dash")}</div>`;
}
const cnt=s=>orders.reduce((n,o)=>n+mods(o).filter(m=>m.src===s).length,0);

/* ---- Shared list ---- */
function list(rows,mode){
  if(!rows.length)return `<div class="empty">مفيش طلبات</div>`;
  return `<div class="tw"><table><tr><th>رقم الطلب</th><th>العميل</th><th>الموقف</th><th>التعديلات</th><th>التحصيل</th><th>آخر حركة</th><th></th></tr>
  ${rows.map(o=>{const l=(o.log||[]).slice(-1)[0],m=mods(o),lm=m.slice(-1)[0];return `<tr><td><b>${esc(o.num)}</b></td><td>${esc(o.customer)}<div class="mut">${esc(o.phone)} · ${o.amount||0} ج</div></td>
  <td>${tag(o.stage)}${o.stage==="hold"&&o.holdReason?`<div class="hold">السبب: ${esc(o.holdReason)}</div>`:""}${o.shipRef?`<div class="mut">شحنة: ${esc(o.shipRef)}</div>`:""}${shipTxt(o)}<div class="mut">${whTxt(o)}</div>${pendKeys(o).length?`<div class="hold">بانتظار اطلاع: ${pendKeys(o).map(tlabel).join("، ")}</div>`:""}</td>
  <td>${m.length?`<span class="mod">${m.length}</span><div class="mut">آخر تعديل: ${esc(lm.text)}</div>`:`<span class="mut">—</span>`}</td>
  <td>${payTag(o)}</td>
  <td class="mut">${l?fmt(l.t)+"<br>"+esc(l.by)+(l.rl?" ("+esc(l.rl)+")":""):""}</td>
  <td>${mode==="tele"&&!["delivered","cancelled"].includes(o.stage)?modBox(o,"tele")+`<div style="margin-top:6px"><input class="wi" id="pc-${o.id}" type="number" placeholder="المبلغ المحصّل" style="width:120px"><button class="b s" onclick="girlCollect('${o.id}')">سجّل تحصيل</button></div> `:""}${mode==="dash"?(delAsk===o.id?`<button class="b x" style="background:var(--bad)" onclick="deleteOrder('${o.id}')">تأكيد الحذف</button> <button class="b s x" onclick="delAsk=null;render()">إلغاء</button> `:`<button class="b s x" onclick="delAsk='${o.id}';render()">حذف</button> `):""}<button class="b s" onclick="openId=openId==='${o.id}'?null:'${o.id}';render()">السجل</button></td></tr>
  ${openId===o.id?`<tr><td colspan="7"><b>الأصناف والكميات</b>${itemsTbl(o)}<div class="log" style="margin-top:8px">${(o.log||[]).map(x=>`${x.kind==="mod"?"🔧":"•"} ${fmt(x.t)} – ${esc(x.by)}${x.rl?" ("+esc(x.rl)+")":""}: ${esc(x.text)}`).join("<br>")}</div></td></tr>`:""}`}).join("")}</table></div>`;
}

const allowed=()=>owner?["tele","log","wm","wo","acc","dash"]:["tele","log","wm","wo","acc"].includes(role)?[role]:[];
const PINID={log:"pin",wm:"pinwm",wo:"pinwo",acc:"pina"};
function chooser(){
  const sec=(r,label)=>`<div style="margin-top:14px"><label>${label}${pins[r]?" (الرقم السري مطلوب)":""}</label>${pins[r]?`<input class="ci" id="${PINID[r]}" type="password" placeholder="الرقم السري">`:""}
  <button class="b s" style="width:100%;margin-top:8px" onclick="pick('${r}')">دخول ${label}</button></div>`;
  const names=namesList();
  return `<div class="card" style="max-width:420px;margin:30px auto"><b>اختار شاشتك</b>
  <div style="margin-top:12px"><label>شاشة التيليسيلز – دوسي على اسمك</label>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${names.map((n,i)=>`<button class="b ${n===selGirl?"ok":"s"}" style="padding:12px 18px;font-size:16px" onclick="selGirl=namesList()[${i}];render()">${n===selGirl?"✓ ":""}${esc(n)}</button>`).join("")||'<span class="mut">مفيش أسماء مسجلة – المدير يضيفها من الداشبورد</span>'}</div>
  ${selGirl?`${pinOf(selGirl)?'<input class="ci" id="pint" type="password" placeholder="الرقم السري بتاعك" style="margin-top:8px">':""}<button class="b" style="width:100%;margin-top:8px" onclick="pick('tele')">دخول باسم ${esc(selGirl)}</button>`:""}</div>
  ${sec("log","شاشة اللوجيستك")}${sec("wm","شاشة مخزن مشعل")}${sec("wo","شاشة مخزن أكتوبر")}${sec("acc","شاشة الحسابات")}
  <div class="mut" style="margin-top:12px">الداشبورد متاح لمالك الصفحة فقط.</div></div>`}
function pick(r){
  if(r==="tele"){
    if(!selGirl)return toast("دوسي على اسمك الأول");
    const p=pinOf(selGirl);if(p&&($("#pint")?.value||"")!==p)return toast("الرقم السري غلط");
  }else if(pins[r]&&($("#"+PINID[r])?.value||"")!==pins[r])return toast("الرقم السري غلط");
  role=r;try{localStorage.setItem("role",r)}catch(e){};view=r;typing=false;
  if(!owner){
    let nm;
    if(r==="tele"){nm=selGirl;try{localStorage.setItem("who_tele",nm)}catch(e){}}
    else{nm=({log:"مروان",acc:"شيماء"})[r];if(!nm){try{nm=localStorage.getItem("who_"+r)||""}catch(e){nm=""}}}
    who=nm;$("#who").value=nm;
  }
  render();
}
async function saveContacts(l){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("settings").doc("contacts").set({phones:l});toast("تم الحفظ ✔",true)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
const addContact=()=>{const n=$("#cn").value.trim(),p=$("#cp").value.trim(),pn=$("#cpin").value.trim();if(!n||!p)return toast("اكتب الاسم والرقم");if(contacts.some(c=>c.name===n))return toast("الاسم ده موجود");saveContacts([...contacts,{name:n,phone:p,pin:pn}])};
const setGirlPin=i=>saveContacts(contacts.map((c,k)=>k===i?{...c,pin:$("#gp-"+i).value.trim()}:c));
const delContact=i=>saveContacts(contacts.filter((_,k)=>k!==i));
async function savePin(){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("settings").doc("pins").set({log:$("#pinin").value.trim(),wm:$("#pinwm").value.trim(),wo:$("#pinwo").value.trim(),acc:$("#pinacc").value.trim()});toast("تم حفظ الرقم السري ✔",true)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
function render(){
  const al=allowed();
  $("#ownerBtn").textContent=owner?"خروج المدير":"دخول المدير";
  const tl=(owner?view==="tele":role==="tele"),box=$("#whoBox");
  $("#who").style.display=tl?"none":"";box.style.display=tl?"flex":"none";
  if(tl)box.innerHTML=owner?'<span class="mut" style="width:100%">اختار اسم البنت اللي الطلب يتسجّل عليها:</span>'+(namesList().map((n,i)=>`<button class="b ${n===who?"ok":"s"}" style="padding:12px 18px;font-size:16px" onclick="pickGirl(${i})">${n===who?"✓ ":""}${esc(n)}</button>`).join("")||'<span class="mut">مفيش أسماء مسجلة</span>'):'<span style="font-size:16px">👤 مسجّلة باسم: <b>'+esc(who||"—")+'</b></span>';
  $("#names").innerHTML=contacts.map(c=>`<option value="${esc(c.name)}">`).join("");
  $("#chg").style.display=(!owner&&role)?"":"none";
  document.querySelector("nav").style.display=al.length>1?"":"none";
  document.querySelector("#who").parentNode.style.display=al.length?"":"none";
  if(!al.length){$("#app").innerHTML=chooser();return}
  if(!al.includes(view))view=al[0];
  document.querySelectorAll("nav button").forEach(b=>{b.style.display=al.includes(b.dataset.v)?"":"none";b.classList.toggle("on",b.dataset.v===view)});
  const ae=document.activeElement&&document.activeElement.id;
  $("#app").innerHTML=(owner?"":inbox())+(view==="tele"?teleView():view==="log"?logView():view==="wm"||view==="wo"?whView(view):view==="acc"?accView():dashView());
  if(ae==="qn"||ae==="qg"){const e=document.getElementById(ae);if(e){e.focus();const n=e.value.length;try{e.setSelectionRange(n,n)}catch(x){}}}
}
let typing=false;document.addEventListener("input",()=>typing=true);
function refresh(){const ae=document.activeElement,id=(ae&&ae.id)||"";if(typing&&(document.querySelector("#num")||document.querySelector("#mtxt")||document.querySelector(".ci")||document.querySelector("textarea")||["pinin","pinwm","pinwo","pinacc","cn","cp","cpin","rn"].includes(id)||id.indexOf("gp-")===0||(ae&&ae.classList&&ae.classList.contains("wi"))))return;typing=false;render()}
$("#who").value=who;$("#who").oninput=()=>{typing=false};
render();
let listening=false;
function ownerLogin(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast("تعذر الدخول: "+(e.message||e.code)))}
function ownerLogout(){firebase.auth().signOut()}
function startListeners(){
  if(listening)return;listening=true;
  db=firebase.firestore();
  const err=e=>{const m=$("#msg");m.style.display="block";m.textContent="خطأ في الاتصال بقاعدة البيانات: "+(e.message||e.code)};
  db.collection("settings").onSnapshot(x=>{pins={};reasons=DEFAULT_REASONS.slice();x.docs.forEach(d=>{const v=d.data()||{};if(d.id==="reasons"){const l=toArr(v.list).filter(Boolean);reasons=l}else if(v.phones)contacts=mergeC(toArr(v.phones).filter(x=>x&&x.name));else pins=v});refresh()},err);
  db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{orders=s.docs.map(d=>d.data());refresh()},err);
}
(function(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    auth.onAuthStateChanged(async u=>{
      if(!u){try{await auth.signInAnonymously()}catch(e){toast("فعّل Anonymous Sign-in في Firebase: "+(e.message||e.code))}return}
      owner=!!(u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase());
      startListeners();render();
    });
  }catch(e){const m=$("#msg");m.style.display="block";m.textContent="إعدادات Firebase ناقصة: "+(e.message||e)}
})();
</script>
</body>
</html>
