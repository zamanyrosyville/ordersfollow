<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة طلبات العملاء</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dfe4ea;--pri:#1f6feb;--ok:#1a9d55;--bad:#d63b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222c;--tx:#e8edf3;--mut:#93a0b1;--bd:#2c3644}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0 0 10px;font-size:18px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{flex:1;min-width:110px;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}.row .x{flex:0 0 auto;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
button.b{padding:9px 14px;border:0;border-radius:7px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.b.ok{background:var(--ok)}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;text-align:center}
.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut)}
.kpi.on{outline:2px solid var(--pri)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.mut{color:var(--mut);font-size:12px}
.hold{color:var(--bad);font-size:13px}
.log{font-size:13px;line-height:1.9;border-top:1px dashed var(--bd);padding-top:6px}
.empty{text-align:center;color:var(--mut);padding:30px}
.mod{background:#8a4fd6;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
#msg{background:#fff3cd;color:#664d03;padding:8px 14px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="msg"></div>
<div id="notify" style="position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:12px;right:12px;z-index:19;display:none;background:#25d366;color:#fff;padding:12px;border-radius:8px;text-align:center"></div>
<div id="toast" style="position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:12px;right:12px;z-index:20;display:none;background:#d63b3b;color:#fff;padding:12px;border-radius:8px;text-align:center"></div>
<header>
  <h1>📦 متابعة طلبات العملاء <span class="mut" style="font-weight:normal">(نسخة Firebase)</span></h1>
  <div style="margin-bottom:8px"><input id="who" list="names" placeholder="اسمك (مطلوب قبل أي حفظ)" style="max-width:320px"><datalist id="names"></datalist><div id="whoBox" style="display:none;flex-wrap:wrap;gap:6px;align-items:center"></div></div>
  <button class="b s" id="ownerBtn" style="margin-bottom:8px" onclick="owner?ownerLogout():ownerLogin()">دخول المدير</button>
  <button class="b s" id="chg" style="display:none;margin-bottom:8px" onclick="role='';try{localStorage.removeItem('role')}catch(e){};render()">تغيير الشاشة</button>
  <nav>
    <button data-v="tele">شاشة التيليسيلز</button>
    <button data-v="log">شاشة اللوجيستك</button>
    <button data-v="wm">مخزن مشعل</button>
    <button data-v="wo">مخزن أكتوبر</button>
    <button data-v="acc">شاشة الحسابات</button>
    <button data-v="dash">الداشبورد (الإدارة)</button>
  </nav>
</header>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== عدّل القيم دي بس ====== */
const FIREBASE_CONFIG={apiKey:"AIzaSyAnhSG87VR9Uuev-Ybog1vMArwGPO-xgBE",authDomain:"follow-telesales.firebaseapp.com",projectId:"follow-telesales",appId:"1:93502420574:web:cfad17f249e5876e34e6cf"};
const OWNER_EMAIL="walidelkadi73@gmail.com";
/* ============================== */
const STAGES={new:["جديد – بانتظار اللوجيستك","#6b7686"],checking:["قيد المراجعة بالمخازن","#1f6feb"],modified:["معدّل – يحتاج مراجعة","#8a4fd6"],hold:["متوقف","#d63b3b"],ready:["جاهز للشحن","#d98a00"],shipped:["تم الشحن","#0c8fa8"],delivered:["تم التسليم","#1a9d55"],cancelled:["ملغي","#444"]};
const SRC=["العميل","اللوجيستك","التيليسيلز (خطأ/تصحيح)"];
let role="",owner=false,pins={};try{role=localStorage.getItem("role")||""}catch(e){}
let db=null,orders=[],view="tele",who="",filter="all",openId=null,modFor=null,selGirl="";
try{who=localStorage.getItem("who")||"";view=localStorage.getItem("v")||"tele";if(role)who=localStorage.getItem("who_"+role)||who}catch(e){}
const $=s=>document.querySelector(s);
const RL={tele:"التيليسيلز",log:"اللوجيستك",wm:"مخزن مشعل",wo:"مخزن أكتوبر",acc:"الحسابات"};
const WHN={wm:"مخزن مشعل",wo:"مخزن أكتوبر"};
const whName=o=>WHN[o.whId]||"المخزن";
const wn=id=>whName(orders.find(x=>x.id===id)||{});
const pinOf=n=>String((contacts.find(c=>c.name===n)||{}).pin||"");
const actor=()=>owner?"المدير":who.trim();
const actorRole=()=>owner?"المدير":(RL[role]||"");
let qNum="",qGirl="",wipeAsk=false,delAsk=null;
const match=o=>(!qNum||String(o.num).includes(qNum))&&(!qGirl||String(o.createdBy||"").includes(qGirl));
const searchBar=()=>`<div class="card"><div class="g2"><input id="qn" placeholder="🔍 بحث برقم طلب العميل" value="${esc(qNum)}" oninput="qNum=this.value.trim();render()"><input id="qg" placeholder="🔍 بحث باسم البنت" value="${esc(qGirl)}" oninput="qGirl=this.value.trim();render()"></div><div class="mut" style="margin-top:6px">إجمالي الطلبات المسجّلة في السيستم: <b>${orders.length}</b>${(qNum||qGirl)?" · فيه بحث شغّال، امسح الخانتين لعرض الكل":""}</div></div>`;
async function deleteOrder(id){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("orders").doc(id).delete();delAsk=null;toast("تم الحذف ✔",true)}catch(e){toast("تعذر الحذف: "+(e.message||e.code))}
}
async function wipeAll(){
  if(!db)return toast("الحفظ غير متاح");
  try{await Promise.all(orders.map(o=>db.collection("orders").doc(o.id).delete()));wipeAsk=false;toast("تم مسح كل الطلبات ✔",true)}catch(e){toast("تعذر المسح: "+(e.message||e.code))}
}
const DEFAULT_REASONS=["الصنف غير متوفر بالمخزن","الكمية غير كافية","العميل طلب التأجيل","العميل لا يرد","العنوان غير واضح","بانتظار تحصيل المبلغ"];
let reasons=DEFAULT_REASONS.slice();
const reasonSel=(id,cur,cb)=>`<select class="wi" id="${id}" ${cb?`onchange="${cb}"`:""}><option value="">— اختار السبب —</option>${[...new Set([...(cur&&!reasons.includes(cur)?[cur]:[]),...reasons])].map(r=>`<option ${r===cur?"selected":""}>${esc(r)}</option>`).join("")}</select>`;
async function saveReasons(l){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("settings").doc("reasons").set({list:l});toast("تم حفظ الأسباب ✔",true)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
const addReason=()=>{const v=$("#rn").value.trim();if(!v)return toast("اكتب السبب");if(reasons.includes(v))return toast("السبب ده موجود");saveReasons([...reasons,v])};
const delReason=i=>saveReasons(reasons.filter((_,k)=>k!==i));
const OWNER_WA="201007483001";
const DEFAULTS=[{name:"ياسمين عيسي",phone:"01060390006"},{name:"منار محمد",phone:"01040028295"},{name:"هاجر سعيد",phone:"01022151188"}];
const toArr=v=>Array.isArray(v)?v:Object.values(v||{});
const namesList=()=>[...new Set([...contacts.map(c=>c.name),...orders.map(o=>o.createdBy).filter(Boolean)])];
let contacts=DEFAULTS.slice();
const mergeC=l=>l;
const waNum=n=>{n=String(n).replace(/\D/g,"");if(n.startsWith("0"))n="2"+n;else if(n.startsWith("1"))n="20"+n;return n};
function notice(o,text){
  const msg="🔔 تعديل على طلب #"+o.num+"\nالعميل: "+o.customer+"\nالحالة الحالية: "+STAGES[o.stage][0]+"\nموضوع التعديل: "+text+"\n\nالمعدِّل: "+actor()+(owner?"":" ("+actorRole()+")");
  const link=(num,label)=>'<a target="_blank" rel="noopener noreferrer" style="color:#fff;font-weight:bold;text-decoration:none;display:block;padding:4px" href="https://wa.me/'+waNum(num)+'?text='+encodeURIComponent(msg)+'" onclick="setTimeout(()=>$(\'#notify\').style.display=\'none\',300)">📲 '+label+'</a>';
  const actorTele=!owner&&role==="tele";
  const c=contacts.find(x=>x.name===o.createdBy);
  let h="";
  if(!actorTele&&c)h+=link(c.phone,"ابعت إشعار لـ "+esc(c.name)+" (صاحبة الطلب)");
  if(!owner||actorTele)h+=link(OWNER_WA,"ابعت إشعار للمدير");
  if(!h)return;
  const n=$("#notify");
  n.innerHTML=h+'<span style="cursor:pointer;font-size:13px" onclick="$(\'#notify\').style.display=\'none\'">إغلاق ✕</span>';
  n.style.display="block";
}

function toast(t,ok){const e=$("#toast");e.textContent=t;e.style.background=ok?"#1a9d55":"#d63b3b";e.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>e.style.display="none",4000)}
window.alert=t=>toast(t);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString("ar-EG",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const tag=k=>`<span class="tag" style="background:${STAGES[k][1]}">${STAGES[k][0]}</span>`;
const payTag=o=>o.acct==="full"?`<span class="tag" style="background:#1a9d55">تحصيل كامل مؤكد</span>`:o.acct==="partial"?`<span class="tag" style="background:#d98a00">تحصيل جزئي مؤكد: ${o.accAmt} من ${o.amount||0}</span>`:o.collected?`<span class="tag" style="background:#0c8fa8">البنت بلّغت تحصيل ${o.collected} – بانتظار الحسابات</span>`:`<span class="tag" style="background:#6b7686">لم يتم التحصيل</span>`;
const whTxt=o=>{const w=o.wh||{};if(!o.whId)return "لم يتم تحويل الطلب لمخزن بعد";return whName(o)+": "+(w.shipped?"تم الشحن":w.ready==="yes"?"الأصناف جاهزة":w.ready==="no"?"غير جاهزة"+(w.reason?" ("+w.reason+")":""):"لم يرد بعد")};
const tlabel=k=>k==="log"?"اللوجيستك (مروان)":k==="wm"?"مخزن مشعل":k==="wo"?"مخزن أكتوبر":k==="wh"?"المخزن":k==="acc"?"الحسابات (شيماء)":k.replace("tele:","");
const pendKeys=o=>[...new Set((o.mentions||[]).flatMap(m=>m.to.filter(k=>!(m.ack||{})[k])))];
const myKey=()=>role==="tele"?"tele:"+who.trim():role;
function targets(r,o,text){
  const c="tele:"+o.createdBy;let t=[];
  if(r==="tele")t=["log"];else if(r==="log")t=[...(o.whId?[o.whId]:[]),c];else if(r==="wm"||r==="wo")t=[c,"log"];else if(r==="acc")t=[c];
  if(r==="tele"&&/^التحصيل/.test(text))t.push("acc");
  return t;
}
function inbox(){
  const k=myKey(),it=[];
  orders.forEach(o=>(o.mentions||[]).forEach(m=>{if(m.to.includes(k)&&!(m.ack||{})[k])it.push([o,m])}));
  if(!it.length)return "";
  return `<div class="card" style="border:2px solid #8a4fd6"><b>🔔 إشارات ليك (${it.length}) – لازم تأكد الاطلاع</b>${it.map(([o,m])=>`<div class="row" style="margin-top:8px"><div>#${esc(o.num)} ${esc(o.customer)} – <b>${esc(m.by)}</b>: ${esc(m.text)} <span class="mut">${fmt(m.t)}</span></div><button class="b ok x" onclick="ack('${o.id}','${m.id}')">تم الاطلاع</button></div>`).join("")}</div>`;
}
async function ack(oid,mid){
  const k=myKey(),o=JSON.parse(JSON.stringify(orders.find(x=>x.id===oid))),m=o.mentions.find(x=>x.id===mid);
  m.ack={...(m.ack||{}),[k]:Date.now()};
  try{await db.collection("orders").doc(oid).set(o)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
const mods=o=>(o.log||[]).filter(l=>l.kind==="mod");

/* ---- الأصناف والكميات (لصق من الإكسيل) ---- */
let editItems=null;
const ar2en=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".");
const isNum=s=>s!==""&&!isNaN(+String(s).replace(",","."));
function parseItems(txt){
  const items=[],bad=[],lines=ar2en(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  lines.forEach((line,idx)=>{
    let c=line.split("\t").map(s=>s.trim()).filter(Boolean);
    if(c.length<2){const m=line.match(/^(.*\S)\s+(\d+(?:[.,]\d+)?)$/);if(m)c=[m[1].replace(/[,;،\s]+$/,""),m[2]]}
    if(c.length<2)c=line.split(/\s{2,}|[,;،]/).map(s=>s.trim()).filter(Boolean);
    if(c.length>=2&&isNum(c[c.length-1]))items.push({name:c.slice(0,-1).join(" "),qty:+c[c.length-1].replace(",",".")});
    else if(c.length>=2&&isNum(c[0]))items.push({name:c.slice(1).join(" "),qty:+c[0].replace(",",".")});
    else if(idx===0&&lines.length>1)return; /* سطر العناوين (الصنف / الكمية) */
    else bad.push(line);
  });
  return {items,bad};
}
const itemsTsv=o=>(o.items||[]).map(i=>i.name+"\t"+i.qty).join("\n");
const itemsTbl=o=>(o.items&&o.items.length)?`<div class="tw" style="margin-top:6px"><table style="max-width:420px"><tr><th>الصنف</th><th>الكمية</th></tr>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td><b>${esc(i.qty)}</b></td></tr>`).join("")}</table></div>`:`<div class="mut" style="margin-top:6px">مفيش أصناف مسجّلة للطلب ده</div>`;
function itemsBox(o){
  if(editItems!==o.id)return `<div><b>الأصناف والكميات</b> <span class="mut">(${(o.items||[]).length} صنف)</span>${itemsTbl(o)}<button class="b s" style="margin-top:6px" onclick="editItems='${o.id}';render()">${(o.items||[]).length?"تعديل / لصق من جديد":"📋 لصق الأصناف من الإكسيل"}</button></div>`;
  return `<div><b>الأصناف والكميات</b><div class="mut">انسخ من الإكسيل عمودين (الصنف ثم الكمية) والصقهم هنا. لو في أصناف قديمة هتتبدّل بالجديدة.</div>
  <textarea class="wi" id="it-${o.id}" rows="7" placeholder="مثال:&#10;كرتونة مياه&#9;10&#10;زيت عباد&#9;5" style="margin-top:6px">${esc(itemsTsv(o))}</textarea>
  <div class="row" style="margin-top:6px"><button class="b ok" onclick="saveItems('${o.id}')">حفظ الأصناف</button><button class="b s" onclick="editItems=null;render()">إلغاء</button></div></div>`;
}
async function saveItems(id){
  const r=parseItems($("#it-"+id)?.value||"");
  if(r.bad.length)return toast("السطر ده مش مفهوم (لازم صنف وجنبه كمية): "+r.bad[0]);
  if(!r.items.length)return toast("الصق الأصناف والكميات الأول");
  const cur=orders.find(x=>x.id===id),had=!!(cur&&cur.items&&cur.items.length);
  editItems=null;
  if(had){
    await upd(id,o=>{o.items=r.items;if(!["shipped","delivered","cancelled"].includes(o.stage)){o.stage="modified";o.wh={...(o.wh||{}),ready:"pending",shipped:false}}},"تعديل (اللوجيستك): تحديث الأصناف والكميات ("+r.items.length+" صنف)","mod",{src:SRC[1]});
  }else await upd(id,o=>{o.items=r.items},"تحديث الأصناف والكميات ("+r.items.length+" صنف)");
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;qNum="";qGirl="";try{localStorage.setItem("v",view)}catch(e){}render()});

function pickGirl(i){if(!owner)return;const v=namesList()[i];if(!v)return;who=v;$("#who").value=v;try{localStorage.setItem("who_tele",v)}catch(e){};render()}
function needName(){
  if(owner){
    if(view==="tele"&&!who.trim()){toast("اختاري اسم البنت اللي الطلب يتسجّل عليها (فوق)");return false}
    return true;
  }
  const v=(role==="tele"?who:$("#who").value).trim();
  if(v){who=v;try{localStorage.setItem("who_"+role,who)}catch(e){}return true}
  toast(role==="tele"?"دوسي على «تغيير الشاشة» وادخلي باسمك والرقم السري":"اكتب اسمك في الخانة اللي فوق الأول");return false;
}


async function save(o,text,kind,extra){
  if(!db)return alert("الحفظ غير متاح: افتح الرابط بحساب مسجّل وصلاحية Contributor أو أعلى.");
  o.log=[...(o.log||[]),{t:Date.now(),by:actor(),rl:actorRole(),text,kind:kind||"st",...(extra||{})}];
  try{await db.collection("orders").doc(o.id).set(o);toast("تم الحفظ ✔",true)}catch(e){alert("تعذر الحفظ: "+(e.message||e.code))}
}
async function upd(id,fn,text,kind,extra){
  if(!needName())return;
  const o=JSON.parse(JSON.stringify(orders.find(x=>x.id===id))),r=owner?"owner":role;
  if(r==="tele"&&o.createdBy!==who)return toast("الطلب ده مش بتاعك – بس اللي عملته تقدر تعدّل عليه");
  if((r==="wm"||r==="wo")&&o.whId!==r)return toast("الطلب ده مش محوّل على مخزنك");
  fn(o);
  const to=targets(r,o,text);let t2=text;
  if(to.length){o.mentions=[...(o.mentions||[]),{id:""+Date.now(),t:Date.now(),by:actor(),from:r,text,to,ack:{}}];t2+=" [إشارة إلى: "+to.map(tlabel).join("، ")+"]"}
  await save(o,t2,kind,extra);typing=false;render();
  if(kind==="mod"||/^(المخزن|مخزن|تحويل|تحديث الأصناف|تغيير الحالة|سبب التوقف|التحصيل|الحسابات)/.test(text))notice(o,text);
}

/* ---- modification box (used by both telesales & logistics) ---- */
function modBox(o,side){
  if(modFor!==o.id)return `<button class="b s" onclick="modFor='${o.id}';render()">+ تسجيل تعديل</button>`;
  return `<div class="card" style="margin:8px 0"><div class="g2"><div><label>التعديل طلبه مين؟</label><select id="msrc">${SRC.map(s=>`<option ${s===(side==="log"?"اللوجيستك":"العميل")?"selected":""}>${s}</option>`).join("")}</select></div>

async function doMod(id){

}

}
const addContact=()=>{const n=$("#cn").value.trim(),p=$("#cp").value.trim(),pn=$("#cpin").value.trim();if(!n||!p)return toast("اكتب الاسم والرقم");if(contacts.some(c=>c.name===n))return toast("الاسم ده موجود");saveContacts([...contacts,{name:n,phone:p,pin:pn}])};
const setGirlPin=i=>saveContacts(contacts.map((c,k)=>k===i?{...c,pin:$("#gp-"+i).value.trim()}:c));
const delContact=i=>saveContacts(contacts.filter((_,k)=>k!==i));
async function savePin(){
  if(!db)return toast("الحفظ غير متاح");
  try{await db.collection("settings").doc("pins").set({log:$("#pinin").value.trim(),wm:$("#pinwm").value.trim(),wo:$("#pinwo").value.trim(),acc:$("#pinacc").value.trim()});toast("تم حفظ الرقم السري ✔",true)}catch(e){toast("تعذر الحفظ: "+(e.message||e.code))}
}
function render(){
  const al=allowed();
  $("#ownerBtn").textContent=owner?"خروج المدير":"دخول المدير";
  const tl=(owner?view==="tele":role==="tele"),box=$("#whoBox");
  $("#who").style.display=tl?"none":"";box.style.display=tl?"flex":"none";
  if(tl)box.innerHTML=owner?'<span class="mut" style="width:100%">اختار اسم البنت اللي الطلب يتسجّل عليها:</span>'+(namesList().map((n,i)=>`<button class="b ${n===who?"ok":"s"}" style="padding:12px 18px;font-size:16px" onclick="pickGirl(${i})">${n===who?"✓ ":""}${esc(n)}</button>`).join("")||'<span class="mut">مفيش أسماء مسجلة</span>'):'<span style="font-size:16px">👤 مسجّلة باسم: <b>'+esc(who||"—")+'</b></span>';
  $("#names").innerHTML=contacts.map(c=>`<option value="${esc(c.name)}">`).join("");
  $("#chg").style.display=(!owner&&role)?"":"none";
  document.querySelector("nav").style.display=al.length>1?"":"none";
  document.querySelector("#who").parentNode.style.display=al.length?"":"none";
  if(!al.length){$("#app").innerHTML=chooser();return}
  if(!al.includes(view))view=al[0];
  document.querySelectorAll("nav button").forEach(b=>{b.style.display=al.includes(b.dataset.v)?"":"none";b.classList.toggle("on",b.dataset.v===view)});
  const ae=document.activeElement&&document.activeElement.id;
  $("#app").innerHTML=(owner?"":inbox())+(view==="tele"?teleView():view==="log"?logView():view==="wm"||view==="wo"?whView(view):view==="acc"?accView():dashView());
  if(ae==="qn"||ae==="qg"){const e=document.getElementById(ae);if(e){e.focus();const n=e.value.length;try{e.setSelectionRange(n,n)}catch(x){}}}
}
let typing=false;document.addEventListener("input",()=>typing=true);
function refresh(){const ae=document.activeElement,id=(ae&&ae.id)||"";if(typing&&(document.querySelector("#num")||document.querySelector("#mtxt")||document.querySelector(".ci")||document.querySelector("textarea")||["pinin","pinwm","pinwo","pinacc","cn","cp","cpin","rn"].includes(id)||id.indexOf("gp-")===0||(ae&&ae.classList&&ae.classList.contains("wi"))))return;typing=false;render()}
$("#who").value=who;$("#who").oninput=()=>{typing=false};
render();
let listening=false;
function ownerLogin(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast("تعذر الدخول: "+(e.message||e.code)))}
function ownerLogout(){firebase.auth().signOut()}
function startListeners(){
  if(listening)return;listening=true;
  db=firebase.firestore();
  const err=e=>{const m=$("#msg");m.style.display="block";m.textContent="خطأ في الاتصال بقاعدة البيانات: "+(e.message||e.code)};
  db.collection("settings").onSnapshot(x=>{pins={};reasons=DEFAULT_REASONS.slice();x.docs.forEach(d=>{const v=d.data()||{};if(d.id==="reasons"){const l=toArr(v.list).filter(Boolean);reasons=l}else if(v.phones)contacts=mergeC(toArr(v.phones).filter(x=>x&&x.name));else pins=v});refresh()},err);
  db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{orders=s.docs.map(d=>d.data());refresh()},err);
}
(function(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    auth.onAuthStateChanged(async u=>{
      if(!u){try{await auth.signInAnonymously()}catch(e){toast("فعّل Anonymous Sign-in في Firebase: "+(e.message||e.code))}return}
      owner=!!(u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase());
      startListeners();render();
    });
  }catch(e){const m=$("#msg");m.style.display="block";m.textContent="إعدادات Firebase ناقصة: "+(e.message||e)}
})();
</script>
