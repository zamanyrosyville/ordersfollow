function targets(r,o,text){

const delFleet=(k,i)=>saveFleet({...fleet,[k]:fleet[k].filter((_,x)=>x!==i)});
function fleetRows(){
  const out=[];
  orders.forEach(o=>PACKWH.forEach(w=>{const sh=(o.ship||{})[w];if(!(sh&&sh.done&&(sh.car||sh.driver)))return;
    if(ff.car&&sh.car!==ff.car)return;if(ff.driver&&sh.driver!==ff.driver)return;
    const t=sh.t||0;if(ff.from&&t<new Date(ff.from).getTime())return;if(ff.to&&t>=new Date(ff.to).getTime()+864e5)return;
    out.push({t,car:sh.car||"—",driver:sh.driver||"—",w,o,items:mineItems(o,w).filter(z=>+z.i.picked>0)})}));
  return out.sort((a,b)=>b.t-a.t);
}

/* ---- الأصناف والكميات (لصق من الإكسيل) ---- */
let editItems=null;
const ar2en=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".");
const isNum=s=>s!==""&&!isNaN(+String(s).replace(",","."));
function parseItems(txt){
  const items=[],bad=[],lines=ar2en(txt).split(/\r?\n/).filter(l=>l.trim());
  const cellsOf=l=>l.indexOf("\t")>=0?l.split("\t").map(s=>s.trim()):l.split(/[,;،]/).map(s=>s.trim());
  let map={o:0,c:1,n:2,q:3},start=0;
  if(lines.length){
    const h=cellsOf(lines[0]),m={};
    h.forEach((x,i)=>{if(/طلب|order/i.test(x))m.o=i;else if(/كود|code|sku|باركود/i.test(x))m.c=i;else if(/كمي|qty|quantity|عدد/i.test(x))m.q=i;else if(/صنف|اسم|item|name|بيان|منتج/i.test(x))m.n=i});
    if(Object.keys(m).length&&!h.some(x=>isNum(x))){
      start=1;
      if(m.o!==undefined&&m.n!==undefined&&m.q!==undefined)map={o:m.o,c:m.c,n:m.n,q:m.q};
      else bad.push(lines[0]);
    }
  }
  const need=Math.max(map.o,map.n,map.q,map.c===undefined?0:map.c)+1;
  lines.slice(start).forEach(line=>{
    const c=cellsOf(line);
    const od=c[map.o]||"",n=c[map.n]||"",q=c[map.q]||"",code=map.c!==undefined?(c[map.c]||""):"";
    if(c.length>=need&&od&&n&&isNum(q)&&+q.replace(",",".")>0)items.push({order:od,name:n,code:code,qty:+q.replace(",",".")});
    else bad.push(line);
  });
  return {items,bad};
}
const itemsTsv=o=>(o.items||[]).map(i=>o.num+"\t"+(i.code||"")+"\t"+i.name+"\t"+i.qty).join("\n");

const PACK={"1":{g:1000,n:"عبوة كيلو"},"2":{g:500,n:"عبوة نص كيلو"},"4":{g:250,n:"عبوة ربع كيلو"},"100":{g:100,n:"عبوة 100 جرام"},"50":{g:50,n:"عبوة 50 جرام"},"5":{g:5000,n:"عبوة 5 كيلو"},"25":{g:25000,n:"برميل 25 كيلو"}};
function packOf(code){
  const c=ar2en(String(code||"")).trim();
  let m=c.match(/^(.+?)\s*[\/\\]\s*[pP]?\s*(\d+)$/);
  if(!m)m=c.match(/^(\d+)\s*[pP]\s*(\d+)$/);
  if(!m)return null;
  return {base:m[1].trim(),suf:m[2],pack:PACK[m[2]]||null};
}
const fmtW=g=>{g=Math.round(g*1000)/1000;const k=Math.floor(g/1000),r=Math.round((g-k*1000)*1000)/1000;return ((k?k+" كجم":"")+(k&&r?" و ":"")+(r?r+" جم":""))||"0"};
function itemSt(i){
  const q=+i.qty||0,p=+i.picked||0;
  if(!i.wh)return {c:"un",t:"لم يُحدَّد المخزن"};
  if(q>0&&p>=q)return {c:"ok",t:"جاهز ✓"};
  if(p>0)return {c:i.reason?"bad":"part",t:"تحضير جزئي "+p+"/"+q+(i.reason?" – "+i.reason:"")};

/* يحسب حالة الطلب من حالة الأصناف والشحن */
function recalc(o){
  if(["delivered","cancelled"].includes(o.stage))return;
  const it=o.items||[];if(!it.length||it.some(i=>!i.wh))return;
  if(o.stage==="hold"&&o.holdReason&&!/^مخزن/.test(o.holdReason))return; /* توقف يدوي من اللوجيستك */
  const ready=it.every(i=>+i.qty>0&&+i.picked>=+i.qty),inv=[...new Set(it.map(i=>i.wh))],sh=o.ship||{};
  const all=inv.every(w=>sh[w]&&sh[w].done),any=inv.some(w=>sh[w]&&sh[w].done);
  const short=it.find(i=>(+i.picked||0)<(+i.qty)&&i.reason);
  if(all&&ready){o.stage="shipped";o.holdReason=""}
  else if(any){o.stage="partial";o.holdReason=""}
  else if(ready){o.stage="ready";o.holdReason=""}
  else if(short){o.stage="hold";o.holdReason=WHN[short.wh]+": "+short.name+" – "+short.reason}
  else{o.stage="checking";o.holdReason=""}
  if(o.stage==="shipped")o.shippedAt=o.shippedAt||Date.now();else o.shippedAt=0;
}

const allWh=(oid,w)=>{((orders.find(x=>x.id===oid)||{}).items||[]).forEach((_,x)=>pendWh[oid+"-"+x]=w);render()};
function saveWh(oid){
  const cur=orders.find(x=>x.id===oid);if(!cur||!needName())return;
  const ch=[];(cur.items||[]).forEach((i,x)=>{const k=oid+"-"+x,v=pendWh[k],w=v!==undefined?v:(i.wh||""),u=pendUnit[k];if((v!==undefined&&v!==(i.wh||""))||(w&&!isDec({...i,wh:w})&&u!==undefined&&u!==(i.unit||DEFU)))ch.push(x)});
  if(!ch.length)return toast("مفيش تغيير في التوزيع للحفظ");
  const sel={},un={};ch.forEach(x=>{const k=oid+"-"+x,i=cur.items[x];sel[x]=pendWh[k]!==undefined?pendWh[k]:(i.wh||"");un[x]=pendUnit[k]!==undefined?pendUnit[k]:(i.unit||DEFU)});
  const names=ch.map(x=>cur.items[x].name+" ← "+(WHN[sel[x]]||"بدون مخزن")+(sel[x]&&!isDec({...cur.items[x],wh:sel[x]})?" ("+un[x]+")":""));
  (cur.items||[]).forEach((_,x)=>{delete pendWh[oid+"-"+x];delete pendUnit[oid+"-"+x]});
  upd(oid,o=>{o.ship=o.ship||{};ch.forEach(x=>{const it=o.items[x],moved=sel[x]!==(it.wh||"");it.wh=sel[x];if(sel[x]&&!isDec({...it,wh:sel[x]}))it.unit=un[x];else delete it.unit;if(moved){it.picked=0;it.reason=""}if(sel[x]&&o.ship[sel[x]])o.ship[sel[x]].done=false});recalc(o)},"تحويل أصناف للمخازن: "+names.join("، "));
}
function buildNext(prev,rows){
  const keyOf=i=>i.code?"c:"+i.code:"n:"+i.name;
  const merged=[];rows.forEach(r=>{const m=merged.find(x=>keyOf(x)===keyOf(r)&&x.name===r.name);if(m)m.qty+=r.qty;else merged.push({name:r.name,code:r.code||"",qty:r.qty})});
  const pm={};prev.forEach(p=>pm[keyOf(p)]=p);
  const next=merged.map(i=>{const p=pm[keyOf(i)];return {name:i.name,code:i.code,qty:i.qty,wh:p?p.wh||"":"",...(p&&p.unit?{unit:p.unit}:{}),picked:p?(+p.picked||0):0,reason:p?p.reason||"":""}});
  const sig=l=>JSON.stringify(l.map(i=>[i.name,i.code||"",+i.qty]));
  const same=prev.length>0&&sig(prev)===sig(next),reset=new Set();
  next.forEach(i=>{const p=pm[keyOf(i)];if((!p||+p.qty!==+i.qty)&&i.wh)reset.add(i.wh)});
  prev.forEach(p=>{if(p.wh&&!next.some(n=>keyOf(n)===keyOf(p)))reset.add(p.wh)});
  return {next,same,reset};
}
async function commitItems(id,rows,quiet){
  const cur=orders.find(x=>x.id===id),prev=(cur&&cur.items)||[],had=prev.length>0;
  const {next,same,reset}=buildNext(prev,rows);
  if(same)return "same";
  const fn=o=>{o.items=next;o.ship=o.ship||{};reset.forEach(w=>{if(o.ship[w])o.ship[w].done=false});recalc(o);if(had&&!["delivered","cancelled"].includes(o.stage))o.stage="modified"};
  if(had)await upd(id,fn,"تعديل (اللوجيستك): تحديث الأصناف والكميات ("+next.length+" صنف)","mod",{src:SRC[1]},quiet);
  else await upd(id,fn,"تحديث الأصناف والكميات ("+next.length+" صنف)",undefined,undefined,quiet);
  return "ok";
}
async function saveItems(id){
  const cur=orders.find(x=>x.id===id);if(!cur)return;

  if(r.bad.length)return toast("السطر ده مش مفهوم (لازم رقم الطلب وكود الصنف واسم الصنف والكمية): "+r.bad[0]);

}

const destList=()=>[MISHAL_DEST,...(fleet.dests||[])];
function parseTransfer(txt){
  const items=[],bad=[];
  String(txt||"").split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l)return;
    let c=l.split("\t").map(x=>x.trim());if(c.length<3)c=l.split(/\s{2,}|[,،;]/).map(x=>x.trim()).filter(x=>x!=="");
    if(c.length<3){bad.push(l);return}
    const q=+ar2en(c[2]).replace(",",".");if(!(q>0)){bad.push(l);return}
    items.push({code:c[0],name:c[1],qty:q,unit:/كرتون/.test(c[3]||"")?"كرتونة":/عبو/.test(c[3]||"")?"عبوة":"قطعة"});
  });
  return {items,bad};
}

  if(!al.length){$("#app").innerHTML=chooser();return}
  if(!al.includes(view))view=al[0];
  document.querySelectorAll("nav button").forEach(b=>{b.style.display=al.includes(b.dataset.v)?"":"none";b.classList.toggle("on",b.dataset.v===view)});
  const ae=document.activeElement&&document.activeElement.id;
  $("#app").innerHTML=(owner?"":notifPanel()+inbox())+(view==="tele"?teleView():view==="log"?logView():WHROLES.includes(view)?whView(view):view==="acc"?accView():dashView());
  if(ae==="qn"||ae==="qg"){const e=document.getElementById(ae);if(e){e.focus();const n=e.value.length;try{e.setSelectionRange(n,n)}catch(x){}}}
}
let typing=false;document.addEventListener("input",()=>typing=true);
function snapVals(){const m={};document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]").forEach(e=>{m[e.id]=e.type==="checkbox"?e.checked:e.value});return m}
function refresh(){
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=="checkbox"&&ae.closest&&ae.closest("#app"))return;
  const v=snapVals();render();
  Object.keys(v).forEach(id=>{const e=document.getElementById(id);if(!e||e.value===v[id])return;if(e.type==="checkbox")e.checked=v[id];else if(e.value===""||e.defaultValue===e.value)e.value=v[id]});
}
$("#who").value=who;$("#who").oninput=()=>{typing=false};
render();
let listening=false;
setInterval(()=>{if(db)refresh()},60000);
function ownerLogin(){firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast("تعذر الدخول: "+(e.message||e.code)))}
function ownerLogout(){firebase.auth().signOut()}
function startListeners(){
  if(listening)return;listening=true;
  db=firebase.firestore();
  const err=e=>{const m=$("#msg");m.style.display="block";m.textContent="خطأ في الاتصال بقاعدة البيانات: "+(e.message||e.code)};
  db.collection("settings").onSnapshot(x=>{pins={};shipHours=72;shipHoursBy={};perms={};nperms={};fleet={drivers:[],cars:[],dests:[SOHAG]};wbill={...WB_DEF};reasons=DEFAULT_REASONS.slice();x.docs.forEach(d=>{const v=d.data()||{};if(d.id==="reasons"){const l=toArr(v.list).filter(Boolean);reasons=l}else if(d.id==="rules"){const h=+v.shipHours;if(h>0)shipHours=h;shipHoursBy=v.byMethod||{}}else if(d.id==="perms"){perms=v}else if(d.id==="notif"){nperms=v}else if(d.id==="fleet"){fleet={drivers:toArr(v.drivers).filter(Boolean),cars:toArr(v.cars).filter(Boolean),dests:v.dests?toArr(v.dests).filter(Boolean):[SOHAG]}}else if(d.id==="waybill"){wbill={...WB_DEF,...v}}else if(v.phones)contacts=mergeC(toArr(v.phones).filter(x=>x&&x.name));else pins=v});refresh()},err);
  db.collection("orders").orderBy("createdAt","desc").onSnapshot(s=>{orders=s.docs.map(d=>d.data());checkNew();refresh()},err);
}
(function(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    auth.onAuthStateChanged(async u=>{
      if(!u){try{await auth.signInAnonymously()}catch(e){toast("فعّل Anonymous Sign-in في Firebase: "+(e.message||e.code))}return}
      owner=!!(u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase());
      startListeners();render();
    });
  }catch(e){const m=$("#msg");m.style.display="block";m.textContent="إعدادات Firebase ناقصة: "+(e.message||e)}
})();
</script>
